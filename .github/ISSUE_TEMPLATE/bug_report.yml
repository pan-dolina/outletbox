name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security issue, stop and use
        [private vulnerability reporting](https://github.com/pan-dolina/outletbox/security/advisories/new)
        instead. Never paste a delivery link, a one-time code, an admin password, a real
        recipient's address or a `.env` into a public issue.

  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the page footer, e.g. v0.1.0.
      placeholder: v0.1.0
    validations:
      required: true

  - type: dropdown
    id: side
    attributes:
      label: Where it happens
      options:
        - Recipient side (/d/<token>, the unlock flow, a download)
        - Admin panel (cases, items, links, audit)
        - E-mail delivery
        - Uploads (tus or the streaming PUT)
        - Startup, configuration or the CLI
    validations:
      required: true

  - type: dropdown
    id: mail
    attributes:
      label: Mail driver
      options: [log, smtp, graph (Microsoft 365), ses, not relevant]
    validations:
      required: true

  - type: dropdown
    id: storage
    attributes:
      label: Storage backend
      options: [local disk, S3 / MinIO]
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How it runs
      options: [Docker Compose, Docker, npm start, npm run dev]
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that triggers it. A file size, a file name or the timing of a code often matters.
      placeholder: |
        1. Create a case, upload a 2 GB file, add a recipient with max_opens = 2
        2. Open the link, type the address, enter the code
        3. The page …
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs, status codes, browser console
      description: >
        Redact tokens and codes. Server logs already replace the token in /d/<token> with
        [redacted] and never log a code; the browser network tab does neither.
      render: text

  - type: checkboxes
    id: environment
    attributes:
      label: Environment
      options:
        - label: It runs behind a reverse proxy or load balancer
        - label: TRUST_PROXY is set
        - label: TLS is terminated somewhere in front of the app
        - label: The recipient's mailbox rewrites or scans links (Safe Links, a proxy, an anti-spam gateway)
